name: Install centralized analytics loader
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add loader and narrowly scoped security policy allowances
        run: python3 scripts/install_analytics.py
      - name: Commit HTML-only installation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html'
          if ! git diff --cached --quiet; then
            git commit -m 'Install disabled GA4 loader on every page without body changes'
            git push
          fi
